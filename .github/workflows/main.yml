name: Build Work-Flow

on:
 push:
   branches: [ main ]

jobs:
  build-work-flow:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: setup Node JS
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm install
      - name: build work-flow
        run: npm run build
